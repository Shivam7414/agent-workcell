# Data guard policy for the reference ERP.
#
# For each table: which columns the agent may read, and for each role, which rows. A role with no rule for a table
# gets no rows from it. A column that is not listed is hidden, and `guard doctor` reports it.
# Row rules are SQL conditions on the table's own columns. {user_id} and {supplier_id} are the person's values, taken
# from the host application at login. The roles are described in reference_erp/README.md.

version = 1
schema = "public"
roles = ["admin", "buyer", "supplier_user"]

[principal]
user_id = "bigint"
supplier_id = "bigint"

[tables.departments]
visible = ["id", "code", "name", "annual_budget"]
rows.admin = "true"
rows.buyer = "true"

[tables.products]
visible = ["id", "sku", "name", "category", "unit", "list_price", "is_active", "deleted_at"]
rows.admin = "true"
rows.buyer = "true"
rows.supplier_user = "true"

[tables.suppliers]
visible = ["id", "supplier_number", "name", "status", "city", "payment_terms_days", "created_at", "deleted_at"]
hidden = ["tax_id", "bank_account"]
rows.admin = "true"
rows.buyer = "true"
rows.supplier_user = "id = {supplier_id}"

[tables.users]
visible = ["id", "email", "full_name", "role", "supplier_id", "is_active", "created_at", "deleted_at"]
hidden = ["password_hash"]
rows.admin = "true"
rows.buyer = "role IN ('admin', 'buyer')"
rows.supplier_user = "supplier_id = {supplier_id}"

# A supplier sees an order once it has been sent to them.
[tables.purchase_orders]
visible = ["id", "po_number", "supplier_id", "buyer_id", "department_id", "status", "order_date", "expected_date",
           "approved_by", "approved_at", "notes", "created_at", "deleted_at"]
rows.admin = "true"
rows.buyer = "buyer_id = {user_id}"
rows.supplier_user = """
    supplier_id = {supplier_id} AND status IN ('sent', 'partially_received', 'received', 'closed')"""

[tables.purchase_order_lines]
visible = ["id", "purchase_order_id", "line_no", "product_id", "description", "quantity", "unit_price",
           "discount_pct", "tax_rate"]
rows.admin = "true"
rows.buyer = "purchase_order_id IN (SELECT id FROM purchase_orders WHERE buyer_id = {user_id})"
rows.supplier_user = """
    purchase_order_id IN (
        SELECT id FROM purchase_orders
        WHERE supplier_id = {supplier_id} AND status IN ('sent', 'partially_received', 'received', 'closed'))"""

[tables.goods_receipts]
visible = ["id", "receipt_number", "purchase_order_id", "received_by", "received_date", "status", "note", "created_at"]
rows.admin = "true"
rows.buyer = "purchase_order_id IN (SELECT id FROM purchase_orders WHERE buyer_id = {user_id})"
rows.supplier_user = """
    purchase_order_id IN (
        SELECT id FROM purchase_orders
        WHERE supplier_id = {supplier_id} AND status IN ('sent', 'partially_received', 'received', 'closed'))"""

[tables.goods_receipt_lines]
visible = ["id", "goods_receipt_id", "purchase_order_line_id", "quantity_received", "quantity_rejected"]
rows.admin = "true"
rows.buyer = """
    goods_receipt_id IN (
        SELECT r.id FROM goods_receipts r JOIN purchase_orders o ON o.id = r.purchase_order_id
        WHERE o.buyer_id = {user_id})"""
rows.supplier_user = """
    goods_receipt_id IN (
        SELECT r.id FROM goods_receipts r JOIN purchase_orders o ON o.id = r.purchase_order_id
        WHERE o.supplier_id = {supplier_id} AND o.status IN ('sent', 'partially_received', 'received', 'closed'))"""

# Buyers see the invoices for their own orders. Invoices with no order (freight, service) are not theirs.
[tables.supplier_invoices]
visible = ["id", "document_number", "invoice_number", "supplier_id", "purchase_order_id", "status", "invoice_date",
           "due_date", "subtotal", "tax_amount", "total_amount", "rejection_reason", "submitted_by", "reviewed_by",
           "reviewed_at", "created_at"]
rows.admin = "true"
rows.buyer = "purchase_order_id IN (SELECT id FROM purchase_orders WHERE buyer_id = {user_id})"
rows.supplier_user = "supplier_id = {supplier_id}"

[tables.supplier_invoice_lines]
visible = ["id", "supplier_invoice_id", "purchase_order_line_id", "description", "quantity", "unit_price", "amount"]
rows.admin = "true"
rows.buyer = """
    supplier_invoice_id IN (
        SELECT i.id FROM supplier_invoices i JOIN purchase_orders o ON o.id = i.purchase_order_id
        WHERE o.buyer_id = {user_id})"""
rows.supplier_user = "supplier_invoice_id IN (SELECT id FROM supplier_invoices WHERE supplier_id = {supplier_id})"

# Buyers see no payments.
[tables.payments]
visible = ["id", "payment_number", "supplier_id", "method", "status", "payment_date", "amount", "created_at"]
rows.admin = "true"
rows.supplier_user = "supplier_id = {supplier_id}"

[tables.payment_allocations]
visible = ["id", "payment_id", "supplier_invoice_id", "amount"]
rows.admin = "true"
rows.supplier_user = "payment_id IN (SELECT id FROM payments WHERE supplier_id = {supplier_id})"

[tables.audit_log]
visible = ["id", "user_id", "action", "entity_type", "entity_id", "detail", "created_at"]
rows.admin = "true"
