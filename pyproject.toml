[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agent-workcell"
version = "0.0.1"
description = "Reuse the agent. Engineer the environment. A guarded, checked workplace for AI agents over business data."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "psycopg[binary]>=3.2",
    # The tool server speaks standard MCP over HTTP. These are the official MCP SDK and the web stack it runs on;
    # the project imports starlette, uvicorn and anyio directly, so they are listed too.
    "mcp>=2.3,<3",
    "starlette>=1.0",
    "uvicorn>=0.30",
    "anyio>=4",
    # The HTTP client mcp already uses. The reference host application and the evaluation harness call the answer API
    # with it.
    "httpx2>=2.16",
]

[project.optional-dependencies]
# The first agent runtime: Claude Code, through the Claude Agent SDK. Pinned, because its flags and behaviour change
# between versions and the adapter's hardening is tested against this version.
claude = [
    "claude-agent-sdk==0.2.180",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_workcell"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S608"]

[tool.ruff.lint.per-file-ignores]
# The reference ERP builds SQL only from its own fixed table and column names.
"reference_erp/seed.py" = ["S608"]
"tests/**" = ["S608"]

[tool.pytest.ini_options]
# tests/runtime_conformance calls a real model and costs money. It runs only by hand:
#   pytest tests/runtime_conformance
# tests/embedding_conformance calls a real embedding provider. By hand only, the same way.
testpaths = ["tests/unit", "tests/integration", "tests/security"]
pythonpath = ["."]
markers = [
    "db: needs a PostgreSQL test database (set ERP_TEST_DATABASE_URL)",
]
