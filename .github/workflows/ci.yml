name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: erp_owner
          POSTGRES_PASSWORD: erp_owner_dev
          POSTGRES_DB: erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp_owner -d erp_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      ERP_TEST_DATABASE_URL: postgresql://erp_owner:erp_owner_dev@127.0.0.1:5432/erp_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev,claude]"   # the claude extra: adapter unit tests; no test calls a model
      - run: ruff check .
      # No test may be skipped here: a skipped database test would hide a broken guard.
      - run: pytest -q -rs | tee pytest.log && ! grep -q "skipped" pytest.log
