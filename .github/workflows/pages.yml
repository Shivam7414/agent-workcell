name: Website

# Publishes the website/ folder to GitHub Pages. The site is static: there is no build step.
# In the repository settings, set Pages > Source to "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: website
          # Keep website/.nojekyll in the upload. The action leaves out dotfiles unless told otherwise.
          include-hidden-files: true
      - id: deployment
        uses: actions/deploy-pages@v5
